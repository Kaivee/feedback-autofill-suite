<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Feedback Auto-Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 240px;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .icon-box {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.35);
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 10px;
      color: #94a3b8;
    }

    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .status-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      font-weight: 600;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      background: #334155;
      color: #94a3b8;
      transition: all 0.2s ease;
    }

    .status-badge.active {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.active .pulse-dot {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    .status-detail {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.35;
      word-break: break-word;
      min-height: 28px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-start {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .btn-start:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.45);
    }

    .btn-stop {
      background: #334155;
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .btn-stop:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .footer {
      margin-top: 10px;
      font-size: 9.5px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-box">⚡</div>
    <div class="header-text">
      <h1>Feedback Runner</h1>
      <p>Auto-fill & Submit Suite</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Status</span>
      <span id="statusBadge" class="status-badge">
        <span class="pulse-dot"></span>
        <span id="statusText">IDLE</span>
      </span>
    </div>
    <div id="statusDetail" class="status-detail">Waiting for user action.</div>
  </div>

  <div class="btn-group">
    <button id="btnStart" class="btn-start">
      <span>▶</span> Start Auto-Fill All Courses
    </button>
    <button id="btnStop" class="btn-stop">
      <span>⏹</span> Stop Automation
    </button>
  </div>

  <div class="footer">
    v1.0.0 • Manifest V3
  </div>

  <script src="popup.js"></script>
</body>
</html>
